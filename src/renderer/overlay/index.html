<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'" />
  <title>capture</title>
  <style>
    /* 完全透明的实时选区层：屏幕保持实时显示，只在上面画选框边线 */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; cursor: crosshair; background: transparent; }
    #mask { position: absolute; inset: 0; width: 100%; height: 100%; }
    #tip {
      position: absolute; left: 50%; top: 24px; transform: translateX(-50%);
      color: #fff; font: 13px -apple-system, "Segoe UI", sans-serif;
      background: rgba(0,0,0,.6); padding: 6px 14px; border-radius: 14px;
      pointer-events: none; opacity: .92;
    }
  </style>
</head>
<body>
  <canvas id="mask"></canvas>
  <div id="tip">拖拽框选要识别的区域 · 双击全屏 · Esc / 右键取消</div>
  <script>
    'use strict';
    const { ipcRenderer } = require('electron');

    let displayId = null;
    let start = null;
    let rect = null;

    const canvas = document.getElementById('mask');
    const ctx = canvas.getContext('2d');
    const tip = document.getElementById('tip');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!rect) return;
      tip.style.display = 'none';
      // 黑白双线边框，任意背景上都清晰（同系统截图样式）
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(0,0,0,0.9)';
      ctx.strokeRect(rect.x - 0.5, rect.y - 0.5, rect.width + 1, rect.height + 1);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.width - 1, rect.height - 1);
      // 尺寸标签
      const label = `${Math.round(rect.width)} × ${Math.round(rect.height)}`;
      ctx.font = '12px -apple-system, "Segoe UI", sans-serif';
      const tw = ctx.measureText(label).width + 12;
      const ly = rect.y - 26 < 4 ? rect.y + 6 : rect.y - 26;
      ctx.fillStyle = 'rgba(0,0,0,0.72)';
      ctx.fillRect(rect.x, ly, tw, 20);
      ctx.fillStyle = '#fff';
      ctx.fillText(label, rect.x + 6, ly + 14);
    }

    ipcRenderer.on('overlay:init', (_e, cfg) => {
      displayId = cfg.displayId;
      resizeCanvas();
    });

    window.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      start = { x: e.clientX, y: e.clientY };
      rect = { x: e.clientX, y: e.clientY, width: 0, height: 0 };
    });

    window.addEventListener('mousemove', (e) => {
      if (!start) return;
      rect = {
        x: Math.min(start.x, e.clientX),
        y: Math.min(start.y, e.clientY),
        width: Math.abs(e.clientX - start.x),
        height: Math.abs(e.clientY - start.y),
      };
      draw();
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button !== 0 || !start) return;
      if (rect.width < 5 || rect.height < 5) { // 误触：忽略并继续等待
        start = null; rect = null; ctx.clearRect(0, 0, canvas.width, canvas.height);
        tip.style.display = '';
        return;
      }
      ipcRenderer.send('capture:selected', { displayId, rect, isFull: false });
      start = null;
    });

    window.addEventListener('dblclick', () => {
      rect = { x: 0, y: 0, width: window.innerWidth, height: window.innerHeight };
      ipcRenderer.send('capture:selected', { displayId, rect, isFull: true });
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') ipcRenderer.send('capture:cancelled');
    });
    window.addEventListener('contextmenu', () => ipcRenderer.send('capture:cancelled'));
  </script>
</body>
</html>
