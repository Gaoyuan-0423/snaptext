<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:" />
  <title>capture</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; cursor: crosshair; background: #000; }
    #shot { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; }
    #mask { position: absolute; inset: 0; width: 100%; height: 100%; }
    #tip {
      position: absolute; left: 50%; top: 24px; transform: translateX(-50%);
      color: #fff; font: 13px -apple-system, "Segoe UI", sans-serif;
      background: rgba(0,0,0,.55); padding: 6px 14px; border-radius: 14px;
      pointer-events: none; opacity: .9;
    }
  </style>
</head>
<body>
  <img id="shot" draggable="false" />
  <canvas id="mask"></canvas>
  <div id="tip">拖拽框选要识别的区域 · 双击全屏 · Esc / 右键取消</div>
  <script>
    'use strict';
    const { ipcRenderer } = require('electron');

    let displayId = null;
    let start = null;
    let rect = null;

    const img = document.getElementById('shot');
    const canvas = document.getElementById('mask');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function draw() {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      if (!rect) {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(0, 0, w, h);
        return;
      }
      // 选区外压暗，选区内透出原图
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, w, rect.y);
      ctx.fillRect(0, rect.y + rect.height, w, h - rect.y - rect.height);
      ctx.fillRect(0, rect.y, rect.x, rect.height);
      ctx.fillRect(rect.x + rect.width, rect.y, w - rect.x - rect.width, rect.height);
      // 边框 + 尺寸标签
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 2;
      ctx.strokeRect(rect.x + 1, rect.y + 1, rect.width - 2, rect.height - 2);
      const label = `${Math.round(rect.width)} × ${Math.round(rect.height)}`;
      ctx.font = '12px -apple-system, "Segoe UI", sans-serif';
      const tw = ctx.measureText(label).width + 12;
      const ly = rect.y - 26 < 4 ? rect.y + 6 : rect.y - 26;
      ctx.fillStyle = 'rgba(59,130,246,0.95)';
      ctx.fillRect(rect.x, ly, tw, 20);
      ctx.fillStyle = '#fff';
      ctx.fillText(label, rect.x + 6, ly + 14);
    }

    ipcRenderer.on('overlay:init', (_e, cfg) => {
      displayId = cfg.displayId;
      img.src = cfg.imageUrl;
      resizeCanvas();
      draw();
    });

    window.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      start = { x: e.clientX, y: e.clientY };
      rect = { x: e.clientX, y: e.clientY, width: 0, height: 0 };
    });

    window.addEventListener('mousemove', (e) => {
      if (!start) return;
      rect = {
        x: Math.min(start.x, e.clientX),
        y: Math.min(start.y, e.clientY),
        width: Math.abs(e.clientX - start.x),
        height: Math.abs(e.clientY - start.y),
      };
      draw();
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button !== 0 || !start) return;
      if (rect.width < 5 || rect.height < 5) { // 误触：忽略并继续等待
        start = null; rect = null; draw();
        return;
      }
      ipcRenderer.send('capture:selected', { displayId, rect, isFull: false });
      start = null;
    });

    window.addEventListener('dblclick', () => {
      rect = { x: 0, y: 0, width: window.innerWidth, height: window.innerHeight };
      ipcRenderer.send('capture:selected', { displayId, rect, isFull: true });
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') ipcRenderer.send('capture:cancelled');
    });
    window.addEventListener('contextmenu', () => ipcRenderer.send('capture:cancelled'));
  </script>
</body>
</html>
