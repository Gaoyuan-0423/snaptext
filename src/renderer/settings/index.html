<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'" />
  <title>SnapText 设置</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px 20px; font: 14px -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #111827; }
    h2 { font-size: 15px; margin: 0 0 14px; }
    .row { display: flex; align-items: center; margin-bottom: 14px; gap: 10px; }
    .row label { width: 110px; color: #374151; flex-shrink: 0; }
    .row .hint { font-size: 12px; color: #9ca3af; margin-top: 2px; }
    select, input[type=text], input[type=password] { flex: 1; font: inherit; padding: 5px 8px; border: 1px solid #e5e7eb; border-radius: 6px; background: #fff; }
    select:focus, input:focus { outline: 2px solid rgba(59,130,246,.35); border-color: #3b82f6; }
    footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 20px; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 8px; background: #fff; }
    button { font: inherit; padding: 5px 18px; border-radius: 6px; border: 1px solid #e5e7eb; background: #fff; cursor: pointer; }
    button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    #saved { color: #16a34a; font-size: 12px; align-self: center; margin-right: auto; opacity: 0; transition: opacity .3s; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>SnapText 设置</h2>

  <div class="row">
    <label>快捷键</label>
    <div style="flex:1">
      <input type="text" id="shortcut" placeholder="CommandOrControl+Shift+1" />
      <div class="hint">Electron accelerator 格式，如 CommandOrControl+Shift+1 / Alt+X。保存后生效。</div>
    </div>
  </div>

  <div class="row">
    <label>识别引擎</label>
    <select id="ocrEngine">
      <option value="auto">自动（macOS 用系统 Vision，更快更准）</option>
      <option value="native">系统原生 Vision（仅 macOS）</option>
      <option value="tesseract">Tesseract（跨平台）</option>
    </select>
  </div>

  <div class="row">
    <label>识别语言</label>
    <select id="ocrLangs">
      <option value="chi_sim+eng">中文简体 + 英文</option>
      <option value="chi_tra+eng">中文繁体 + 英文</option>
      <option value="eng">英文</option>
      <option value="jpn+eng">日文 + 英文</option>
      <option value="kor+eng">韩文 + 英文</option>
      <option value="chi_sim+chi_tra+eng">简繁中文 + 英文</option>
    </select>
  </div>

  <div class="row">
    <label>翻译服务</label>
    <select id="provider">
      <option value="libre">LibreTranslate（可自建）</option>
    </select>
  </div>

  <div class="row" id="libreRow">
    <label>Libre 地址</label>
    <input type="text" id="libreUrl" placeholder="填写你选择的 LibreTranslate HTTPS 地址" />
  </div>

  <div class="row" id="libreKeyRow">
    <label>Libre API Key</label><input type="password" id="libreApiKey" autocomplete="off" placeholder="实例需要密钥时填写，仅保存在本机" />
  </div>
  <p style="font-size:12px;color:#6b7280">翻译需先配置服务，OCR 无需配置。点击翻译才发送文字和 API Key；服务商可见 IP 地址，其费用和隐私政策由服务商决定。密钥仅保存在本机；自建实例无需密钥时可留空。远程服务须使用 HTTPS。</p>
  <div class="row">
    <label>翻译成</label>
    <select id="targetLang">
      <option value="zh">中文（简体）</option>
      <option value="zt">中文（繁体，需实例支持）</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="ru">Русский</option>
    </select>
  </div>

  <div class="row">
    <label>识别后自动复制</label>
    <input type="checkbox" id="autoCopy" style="transform: scale(1.2)" />
  </div>

  <div class="row">
    <label>开机自启</label>
    <input type="checkbox" id="launchAtLogin" style="transform: scale(1.2)" />
  </div>

  <footer>
    <span id="saved">已保存 ✓</span>
    <button id="cancel">关闭</button>
    <button id="save" class="primary">保存</button>
  </footer>

  <script>
    'use strict';
    const ipcRenderer = window.snaptext;
    const $ = (id) => document.getElementById(id);

    (async () => {
      const s = await ipcRenderer.invoke('settings:get');
      $('shortcut').value = s.shortcut;
      $('ocrEngine').value = s.ocrEngine;
      $('ocrLangs').value = s.ocrLangs;
      $('provider').value = s.provider;
      $('libreUrl').value = s.libreUrl;
      $('libreApiKey').value = s.libreApiKey || '';
      $('targetLang').value = s.targetLang;
      $('autoCopy').checked = s.autoCopy;
      $('launchAtLogin').checked = s.launchAtLogin;
    })();

    $('save').onclick = async () => {
      try {
      await ipcRenderer.invoke('settings:save', {
        shortcut: $('shortcut').value.trim(),
        ocrEngine: $('ocrEngine').value,
        ocrLangs: $('ocrLangs').value,
        provider: $('provider').value,
        libreUrl: $('libreUrl').value.trim(),
        libreApiKey: $('libreApiKey').value.trim(),
        targetLang: $('targetLang').value,
        autoCopy: $('autoCopy').checked,
        launchAtLogin: $('launchAtLogin').checked,
      });
      $('saved').textContent = '已保存 ✓';
      $('saved').style.opacity = 1;
      setTimeout(() => ($('saved').style.opacity = 0), 1500);
      } catch (error) { $('saved').textContent = '保存失败：' + error.message; $('saved').style.opacity = 1; }
    };

    $('cancel').onclick = () => window.close();
  </script>
</body>
</html>
